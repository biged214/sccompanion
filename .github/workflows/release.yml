name: Build and publish SC Companion

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.platform }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: nsis,msi
          - platform: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: SC Companion v__VERSION__
          releaseBody: |
            ## Spanish and French Translation Fixes

            - Completed missing Spanish interface translations across all sections, including trade routes, ships, components, organizations, blueprints, markets, live sessions, guides, and settings.
            - Translated route criteria, loading controls, sorting options, estimated-time descriptions, and mobile table labels; localized ROI numbers.
            - Fixed untranslated marketplace transaction filters, ship specification labels, live-session headings, cached-data notices, and expanded article controls.
            - Filled shared French translation gaps and updated generated guide labels when switching languages.
            - Added translation-completeness checks for 853 shared messages and browser checks for all sections, saved selections, and smaller-screen layouts.
            - Source articles, game names, and raw logs remain in their original language.

            Existing direct-download Windows and Linux installations can update in the app. No Microsoft Store package is included in this release; the Store edition remains unchanged.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
