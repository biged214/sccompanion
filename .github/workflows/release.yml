name: Build and publish SC Companion

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.platform }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: nsis,msi
          - platform: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify article parsing
        run: node tests/news-parser.mjs && node tests/news-service.mjs && node tests/article-media.mjs && node tests/article-blocks.mjs && node tests/article-cache.mjs

      - name: Build installers and prepare release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: SC Companion v__VERSION__
          releaseBody: |
            ## Article Cache Hotfix

            - Fixed Patch Notes and Announcements failing to open when local storage is full.
            - Article and feed caching is now optional: storage errors no longer hide successfully loaded content.
            - Limited article caches by size, evicted older entries when needed, and removed obsolete article-cache versions.
            - Reduced cache space by storing ordered article content once, while preserving images, videos, settings, and history.

            Microsoft Store updates are distributed separately after publisher submission and Microsoft certification.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
