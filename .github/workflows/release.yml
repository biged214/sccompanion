name: Build and publish SC Companion

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.platform }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: nsis,msi
          - platform: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: SC Companion v__VERSION__
          releaseBody: |
            ## SC Companion 1.0
            First 1.0 release, bringing the existing desktop features together for Windows, Linux, and the Microsoft Store edition.

            - Announcements, News, Patch Notes, and current Server Status with unread indicators and optional notifications.
            - Ships, ship components, organizations, and starter guides in one reference library.
            - Blueprints with recipes, materials, crafting details, Owned/Wanted checklists, and known mission/faction/reputation prerequisites.
            - Commodity Market, Player Marketplace, and trade route planning with cargo compatibility, loading options, and time/profit estimates.
            - Optional local gameplay session history, saved filters, caching, and tray support.

            This release promotes the v0.32.1 feature set to v1.0.0. Store users upgrading from v0.31.2 also receive the Blueprints features added in v0.32.0 and v0.32.1.

            Existing direct-download installations can update in the app. Microsoft Store installations update through the Store after certification. Prices, availability, and route times depend on source data and remain estimates.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
